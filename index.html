<script id="proof-core">
/* Proof core. Original MIT-licensed code. No dependencies, network requests, or telemetry. */
const ProofCore = (() => {
  const ORDER = ['education','experience','projects','leadership','skills','extras'];
  const LABELS = {education:'Education',experience:'Experience',projects:'Projects',leadership:'Leadership & Service',skills:'Skills',extras:'Additional Highlights'};
  const SOURCES = {
    course:{label:'Course projects',icon:'book',description:'Research, presentations, campaigns, group projects.',section:'projects',prompt:'Think of a project where your work changed the final result.',role:'Student researcher',org:'Course or project name',action:'Designed a survey to understand student shopping habits',method:'Google Forms and Excel',result:'identified three themes used in the final campaign proposal'},
    work:{label:'Paid work',icon:'briefcase',description:'Part-time jobs, internships, freelance work.',section:'experience',prompt:'What did people trust you to handle, even on a busy day?',role:'Sales associate',org:'Employer or client',action:'Resolved customer order questions during weekend shifts',method:'the store order system',result:'helped customers choose suitable replacements for unavailable items'},
    campus:{label:'Student organizations',icon:'users',description:'Clubs, events, leadership, team responsibilities.',section:'leadership',prompt:'What would have been harder for the group without your contribution?',role:'Events coordinator',org:'Organization name',action:'Coordinated a student organization welcome event',method:'a shared timeline and volunteer assignments',result:'prepared the space and materials before attendees arrived'},
    volunteer:{label:'Volunteering',icon:'heart',description:'Community work, service, causes you care about.',section:'leadership',prompt:'Who benefited from something you organized, explained, or improved?',role:'Volunteer',org:'Organization or community',action:'Organized donated supplies for a community distribution day',method:'an inventory checklist',result:'gave volunteers a clear record of available supplies'},
    personal:{label:'Personal projects',icon:'spark',description:'Side projects, creative work, independent learning.',section:'projects',prompt:'What did you build or figure out without someone assigning it?',role:'Independent project',org:'Project name',action:'Built a personal budget tracker',method:'Excel formulas and pivot tables',result:'created a monthly view of spending by category'},
    community:{label:'Family & community',icon:'home',description:'Real responsibilities beyond a formal job title.',section:'experience',prompt:'Where have you managed schedules, solved problems, or made information clearer?',role:'Operations support',org:'Family business or community role',action:'Maintained a weekly appointment schedule for a family business',method:'a shared calendar and confirmation messages',result:'gave the team one current schedule to work from'}
  };
  function id(){return typeof crypto!=='undefined' && crypto.randomUUID ? crypto.randomUUID() : 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
  function blank(){return {app:'proof-resume',version:1,contact:{name:'',email:'',phone:'',location:'',linkedin:'',portfolio:'',headline:'',summary:''},education:[],experiences:[],skills:{tools:'',methods:'',languages:''},extras:'',order:[...ORDER],style:'modern',density:'comfortable',remember:true}}
  function experience(source='course'){return {id:id(),source,section:SOURCES[source]?.section||'experience',role:'',organization:'',location:'',dates:'',action:'',method:'',result:'',evidence:'',reflection:'',bullets:'',verified:false,include:true}}
  function education(){return {id:id(),school:'',degree:'',dates:'',location:'',gpa:'',courses:'',honors:''}}
  const trim = v => String(v??'').trim();
  const clean = (v,n=5000) => typeof v==='string'?v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').slice(0,n):'';
  function normalize(raw){
    if(!raw || raw.app!=='proof-resume'||raw.version!==1||!raw.contact||typeof raw.contact!=='object'||!Array.isArray(raw.education)||!Array.isArray(raw.experiences))throw new Error('Choose a valid Proof backup (version 1). Your current résumé has not changed.');
    if(raw.education.length>30||raw.experiences.length>60)throw new Error('This backup has too many entries. Maximum: 30 education entries and 60 experiences.');
    const s=blank();for(const k of Object.keys(s.contact))s.contact[k]=clean(raw.contact[k],k==='summary'?2000:400);
    s.education=raw.education.map(e=>{if(!e||typeof e!=='object')throw new Error('An education entry is invalid.');const n=education();for(const k of Object.keys(n))if(k!=='id')n[k]=clean(e[k],1500);return n});
    s.experiences=raw.experiences.map(e=>{if(!e||typeof e!=='object')throw new Error('An experience entry is invalid.');const source=Object.hasOwn(SOURCES,e.source)?e.source:'work';const n=experience(source);for(const k of ['role','organization','location','dates','action','method','result','evidence','reflection','bullets'])n[k]=clean(e[k]);n.section=['experience','projects','leadership'].includes(e.section)?e.section:SOURCES[source].section;n.include=e.include!==false;n.verified=e.verified===true;return n});
    for(const k of Object.keys(s.skills))s.skills[k]=clean(raw.skills?.[k],2000);s.extras=clean(raw.extras);s.order=Array.isArray(raw.order)&&raw.order.length===ORDER.length&&new Set(raw.order).size===ORDER.length&&raw.order.every(k=>ORDER.includes(k))?[...raw.order]:[...ORDER];s.style=raw.style==='classic'?'classic':'modern';s.density=raw.density==='compact'?'compact':'comfortable';s.remember=raw.remember!==false;return s;
  }
  function draft(e){
    let a=trim(e.action).replace(/[.;\s]+$/,'');if(!a)return '';
    a=a.charAt(0).toUpperCase()+a.slice(1);
    let m=trim(e.method).replace(/[.;\s]+$/,'');let r=trim(e.result).replace(/[.;\s]+$/,'');
    const connector=m?(/^(using|with|through|by|in)\b/i.test(m)?' ':' using '):'';
    return a+connector+m+(r?'; '+r:'')+'.';
  }
  function lines(v){return trim(v).split(/\n+/).map(x=>x.replace(/^\s*[•*\-]\s+/,'').trim()).filter(Boolean)}
  function active(s){return s.experiences.filter(e=>e.include&&(trim(e.role)||trim(e.organization)||lines(e.bullets).length))}
  function assessments(s){const list=active(s),bullets=list.flatMap(e=>lines(e.bullets));return [
    {name:'Make it easy to reach you',ready:!!trim(s.contact.name)&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trim(s.contact.email)),description:'Add your name and a valid email. A city, phone, and portfolio can help too.',step:'details'},
    {name:'Give your education context',ready:s.education.some(e=>trim(e.school)&&trim(e.degree)),description:'Include your school, degree or program, and graduation date if known.',step:'education'},
    {name:'Show what you actually contributed',ready:bullets.length>0,description:'Include at least one specific contribution from work, a project, or service.',step:'experience'},
    {name:'Back up your claims',ready:list.length>0&&list.every(e=>e.verified&&lines(e.bullets).length>0),description:'Review each included experience. Can you explain your role and support every claim?',step:'experience'},
    {name:'Name skills you can demonstrate',ready:Object.values(s.skills).some(v=>trim(v)),description:'List concrete tools, methods, or languages you can discuss or use.',step:'skills'}
  ]}
  function feedback(e){const b=trim(e.bullets),items=[];if(!b)return [{text:'Start with something you did. A useful deliverable can be an outcome, even without a number.',good:false}];
    if(/\b(responsible for|duties included|helped with|worked on)\b/i.test(b))items.push({text:'Name your own action. What did you create, organize, analyze, explain, or change?',good:false});
    if(/\b(hard.?working|team player|go.getter|results.driven|passionate|synergy|rockstar|dynamic professional|detail.oriented)\b/i.test(b))items.push({text:'Replace a general description with an example that lets the reader see that quality.',good:false});
    if(lines(b).some(l=>l.split(/\s+/).length>42))items.push({text:'One bullet is long. Try one contribution per bullet and keep the clearest details.',good:false});
    if(/\d/.test(b))items.push({text:'Check each number: is it accurate, explainable, and clear about your contribution?',good:false});
    if(!trim(e.result))items.push({text:'Consider what changed, who used the work, or what you delivered. Quantification is optional.',good:false});
    if(trim(e.evidence))items.push({text:'You have an evidence note to help you recall the story behind this experience.',good:true});
    if(!items.length)items.push({text:'Read this aloud. Could you explain what you did and why it mattered in an interview?',good:true});return items;
  }
  function content(s){return {name:trim(s.contact.name),contact:['location','email','phone','linkedin','portfolio'].map(k=>trim(s.contact[k])).filter(Boolean),headline:trim(s.contact.headline),summary:trim(s.contact.summary),sections:s.order.map(key=>{let entries=[];
    if(key==='education')entries=s.education.filter(e=>trim(e.school)||trim(e.degree)).map(e=>({title:trim(e.school),sub:[trim(e.degree),trim(e.location),trim(e.dates)].filter(Boolean).join(' | '),bullets:[e.gpa?'GPA: '+trim(e.gpa):'',e.courses?'Relevant coursework: '+trim(e.courses):'',trim(e.honors)].filter(Boolean)}));
    else if(['experience','projects','leadership'].includes(key))entries=active(s).filter(e=>e.section===key).map(e=>({title:[trim(e.role),trim(e.organization)].filter(Boolean).join(' | '),sub:[trim(e.location),trim(e.dates)].filter(Boolean).join(' | '),bullets:lines(e.bullets)}));
    else if(key==='skills')entries=[['Tools',s.skills.tools],['Methods',s.skills.methods],['Languages',s.skills.languages]].filter(([,v])=>trim(v)).map(([k,v])=>({title:'',sub:k+': '+trim(v),bullets:[]}));
    else if(key==='extras')entries=lines(s.extras).map(v=>({title:'',sub:v,bullets:[]}));return {key,title:LABELS[key],entries};}).filter(x=>x.entries.length)};}
  function countWords(s){const c=content(s);return [c.name,...c.contact,c.headline,c.summary,...c.sections.flatMap(x=>[x.title,...x.entries.flatMap(e=>[e.title,e.sub,...e.bullets])])].join(' ').trim().split(/\s+/).filter(Boolean).length}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function xml(v){return esc(clean(String(v??''),50000))}
  function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1}return (c^0xffffffff)>>>0}
  function zip(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
    for(const [name,text]of files){const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data);const h=new Uint8Array(30+nb.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,nb.length,true);h.set(nb,30);chunks.push(h,data);
      const ch=new Uint8Array(46+nb.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nb.length,true);cv.setUint32(42,offset,true);ch.set(nb,46);central.push(ch);offset+=h.length+data.length;
    }const centralSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);const out=new Uint8Array(offset+centralSize+22);let p=0;for(const b of [...chunks,...central,end]){out.set(b,p);p+=b.length}return out;
  }
  function docx(s){const c=content(s),font=s.style==='classic'?'Georgia':'Arial',size=s.density==='compact'?21:22,space=s.density==='compact'?50:75;
    const p=(text,style='Normal')=>`<w:p><w:pPr><w:pStyle w:val="${style}"/>${style==='ListBullet'?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':''}</w:pPr><w:r><w:t xml:space="preserve">${xml(text)}</w:t></w:r></w:p>`;
    let body=p(c.name||'Your name','Title');if(c.contact.length)body+=p(c.contact.join(' | '),'Contact');if(c.headline)body+=p(c.headline,'EntryTitle');if(c.summary)body+=p(c.summary);for(const section of c.sections){body+=p(section.title,'Heading1');for(const e of section.entries){if(e.title)body+=p(e.title,'EntryTitle');if(e.sub)body+=p(e.sub,'Normal');for(const b of e.bullets)body+=p(b,'ListBullet')}}

      ['[Content_Types].xml',header+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>'],
      ['_rels/.rels',header+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>'],
      ['word/document.xml',header+`<w:document xmlns:w="${w}"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="900" w:right="900" w:bottom="900" w:left="900" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>`],
      ['word/styles.xml',header+`<w:styles xmlns:w="${w}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}"/><w:sz w:val="${size}"/><w:color w:val="000000"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="${space}" w:line="250" w:lineRule="auto"/><w:widowControl/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="0" w:after="80"/></w:pPr><w:rPr><w:b/><w:sz w:val="50"/><w:color w:val="000000"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Contact"><w:name w:val="Contact"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:after="120"/></w:pPr><w:rPr><w:sz w:val="20"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:keepLines/><w:spacing w:before="210" w:after="90"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="22"/><w:color w:val="000000"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="EntryTitle"><w:name w:val="Entry title"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="85" w:after="45"/></w:pPr><w:rPr><w:b/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="ListBullet"><w:name w:val="List Bullet"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="${space}"/><w:keepLines/></w:pPr></w:style></w:styles>`],
      ['word/numbering.xml',header+`<w:numbering xmlns:w="${w}"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:tabs><w:tab w:val="num" w:pos="260"/></w:tabs><w:ind w:left="260" w:hanging="200"/></w:pPr><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/></w:rPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>`],
      ['word/_rels/document.xml.rels',header+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>'],
      ['docProps/core.xml',header+'<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+xml((c.name||'Student')+' Resume')+'</dc:title><dc:creator>'+xml(c.name)+'</dc:creator></cp:coreProperties>']
    ]);
  }
  function template(){const s=blank();s.contact={name:'YOUR NAME',email:'you@example.com',phone:'Your phone',location:'City, State',linkedin:'',portfolio:'Your portfolio URL',headline:'',summary:''};s.education=[{...education(),school:'University or college',degree:'Degree and major',dates:'Expected graduation month and year',courses:'Selected courses relevant to your interests'}];s.experiences=[{...experience('course'),role:'Your project role',organization:'Project or course name',dates:'Month Year',bullets:'Describe what you created, analyzed, organized, or improved.\nExplain your method and what you delivered or learned, using accurate details.'},{...experience('work'),role:'Your role',organization:'Employer or organization',dates:'Month Year to Month Year',bullets:'Name a specific contribution and who benefited from it.'}];s.skills.tools='Tools you can demonstrate';s.skills.methods='Methods you have practiced';return s}
  function sample(){const s=blank();s.contact={name:'Jordan Rivera',location:'Edinburg, TX',email:'jordan.rivera@example.com',phone:'(956) 555-0142',linkedin:'linkedin.com/in/jordan-rivera-example',portfolio:'',headline:'',summary:''};s.education=[{...education(),school:'Rio Valley University',degree:'BBA in Marketing',dates:'Expected May 2027',courses:'Consumer Behavior, Marketing Research, Business Analytics'}];s.experiences=[{...experience('course'),role:'Research & Strategy Lead',organization:'Campus Café Course Project',dates:'January to May 2026',action:'Analyzed 86 student survey responses',method:'Excel pivot tables',result:'identified three purchase barriers and presented recommendations to the café owner',bullets:'Analyzed 86 student survey responses in Excel to identify three purchase barriers; presented recommendations to the café owner.\nCreated a four-week content calendar and six campaign mockups in Canva for a student marketing proposal.',evidence:'Fictional example: survey workbook, course presentation, and campaign mockups.',verified:true},{...experience('work'),role:'Sales Associate',organization:'Valley Outfitters',dates:'June 2025 to Present',bullets:'Organized weekly stock checks across four product categories and flagged discrepancies for the shift lead.\nCreated a one-page returns guide that two new team members used during onboarding.',verified:true},{...experience('campus'),role:'Event Volunteer',organization:'Student Business Society',dates:'September 2025 to May 2026',bullets:'Coordinated check-in for a campus networking event with 70 attendees and prepared name tags and registration materials.',verified:true}];s.skills={tools:'Excel (pivot tables), Canva, Google Forms',methods:'Survey analysis, content planning, customer interviews',languages:'English (fluent), Spanish (conversational)'};return s}

})();

<script id="proof-ui">

 const icons={check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',up:'<path d="m6 15 6-6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',book:'<path d="M3 4h6a4 4 0 0 1 3 1 4 4 0 0 1 3-1h6v15h-6a4 4 0 0 0-3 1 4 4 0 0 0-3-1H3zM12 5v15"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12a30 30 0 0 0 18 0M12 11v4"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-6"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',spark:'<path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7z"/>',home:'<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',file:'<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/>',expand:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',bulb:'<path d="M9 18v-2a7 7 0 1 1 6 0v2M9 18h6M10 21h4"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>'};
 const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.file}</svg>`;
 const steps=[['discover','Discover'],['details','Your details'],['education','Education'],['experience','Experience'],['skills','Skills & more'],['finish','Finish & export']];
 const tipTexts={discover:'A good résumé starts with noticing. Choose one part of your life and find a moment that says something about you.',details:'Use contact details you check regularly. City and state are enough; a full street address is not needed.',education:'Early in your career, coursework and projects can help readers understand what you can already do.',experience:'Specific beats spectacular. A clear, honest contribution is more useful than an impressive claim you cannot explain.',skills:'Give skills context: “Excel (pivot tables)” says more than “Microsoft Office.” Include only what you can demonstrate.',finish:'This is your starting résumé. Later, select the most relevant experiences for each opportunity. Review page breaks in Word before sending.'};
 try{const saved=localStorage.getItem(KEY);if(saved){state=C.normalize(JSON.parse(saved));notice='Welcome back. Your résumé was restored from this browser.'}remember=state.remember;}catch(e){remember=false;state.remember=false;notice='Your saved draft could not be read. You can work here and download a backup; nothing has been deleted.'}
 try{if(sessionStorage.getItem('proof-save-mode')==='session'){remember=false;state.remember=false}}catch{}
 function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
 function save(){state.remember=remember;clearTimeout(saveTimer);if(remember){$('#save-state').innerHTML=icon('lock')+'<span>Saving on this device…</span>';saveTimer=setTimeout(flush,300)}else{$('#save-state').innerHTML=icon('lock')+'<span>Session only</span>'}}
 function flush(){if(!remember)return;try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-state').innerHTML=icon('lock')+'<span>Saved on this device</span>'}catch(e){$('#save-state').innerHTML=icon('info')+'<span>Not saved · download backup</span>';toast('Browser storage is unavailable. Download a backup to keep your work.')}}
 function findEntry(id){return state.experiences.find(e=>e.id===id)}
 function nav(){const a=C.assessments(state),count=a.filter(x=>x.ready).length;const done={discover:state.experiences.length>0,details:a[0].ready,education:a[1].ready,experience:a[2].ready&&a[3].ready,skills:a[4].ready,finish:count===5};$('#steps').innerHTML=steps.map(([k,label],i)=>`<button class="nav-step ${step===k?'active':''}" data-action="step" data-step="${k}" ${step===k?'aria-current="step"':''}><span class="step-num ${done[k]&&step!==k?'done':''}">${done[k]&&step!==k?icon('check'):String(i+1).padStart(2,'0')}</span>${label}</button>`).join('');$('#progress-text').textContent=`${count} of 5 foundations ready`;$('#progress').setAttribute('aria-valuenow',count);$('#progress-fill').style.width=(count*20)+'%'}
 function field(key,label,value='',opts={}){const id='f-'+key.replace(/[^a-z0-9-]/gi,'-'),hint=opts.hint?`<p class="hint" id="${id}-hint">${opts.hint}</p>`:'';const attrs=`id="${id}" data-field="${esc(key)}" ${opts.hint?`aria-describedby="${id}-hint"`:''} ${opts.auto?`autocomplete="${opts.auto}"`:'autocomplete="off"'} maxlength="${opts.max||2000}" placeholder="${esc(opts.placeholder||'')}"`;let control;if(opts.select)control=`<select ${attrs}>${opts.select.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('')}</select>`;else if(opts.area)control=`<textarea ${attrs} rows="${opts.rows||3}">${esc(value)}</textarea>`;else control=`<input ${attrs} type="${opts.type||'text'}" value="${esc(value)}">`;return `<div class="field ${opts.wide?'wide':''}"><label for="${id}">${label}${opts.optional?' <span class="optional">Optional</span>':''}</label>${control}${hint}</div>`}
 function head(number,title,desc){return `${notice?`<div class="banner">${esc(notice)} <button class="btn link" data-action="dismiss-notice">Dismiss</button></div>`:''}<div class="section-head"><p class="eyebrow">${number} / YOUR RÉSUMÉ WORKSHOP</p><h1 tabindex="-1">${title}</h1><p>${desc}</p></div>`}
 function next(prev,nextStep,label){return `<div class="next-row">${prev?`<button class="btn subtle" data-action="step" data-step="${prev}">${icon('back')} Back</button>`:'<p>Start anywhere. Come back anytime.</p>'}<button class="btn primary" data-action="step" data-step="${nextStep}">${label||'Continue'} ${icon('arrow')}</button></div>`}
 function discover(){return head('01','You have more to work with<br>than you think.','A résumé starts with real moments. Where have you made something happen? Pick a place to begin.')+`<div class="source-grid">${Object.entries(C.SOURCES).map(([k,s])=>`<button class="source-card" data-action="add-source" data-source="${k}"><span class="source-icon">${icon(s.icon)}</span><span class="plus">${icon('plus')}</span><strong>${s.label}</strong><p>${s.description}</p></button>`).join('')}</div><div class="insight">${icon('bulb')}<div><strong>You do not need a job title to have experience.</strong><p>The project you untangled. The process you made easier. The people who relied on you. Those are places to look for evidence.</p></div></div><button class="btn link mt16" data-action="example">Show me what a specific contribution looks like ${icon('chevron')}</button>${next(null,'details','Start with my details')}`}
 function details(){const c=state.contact;return head('02','Make a good introduction.','Give readers a simple way to understand who you are and reach you.')+`<div class="field-grid">${field('contact.name','Full name',c.name,{wide:true,placeholder:'The name you use professionally',auto:'name',max:150})}${field('contact.email','Email address',c.email,{type:'email',placeholder:'you@example.com',auto:'email',max:200})}${field('contact.phone','Phone',c.phone,{optional:true,type:'tel',placeholder:'(956) 555-0123',auto:'tel',max:60})}${field('contact.location','City and state',c.location,{optional:true,placeholder:'Edinburg, TX',max:150})}${field('contact.linkedin','LinkedIn profile',c.linkedin,{optional:true,placeholder:'linkedin.com/in/your-name',max:350})}${field('contact.portfolio','Portfolio or project URL',c.portfolio,{optional:true,wide:true,placeholder:'yourname.com',max:350,hint:'Include a link only if it contains work you are comfortable sharing.'})}</div><div class="subheading"><h2>A little more context, if it helps.</h2><p>A summary is optional. Use it only when it adds something the rest of your résumé does not show.</p></div><div class="field-grid">${field('contact.headline','Professional focus',c.headline,{wide:true,optional:true,placeholder:'Marketing student with experience in survey research',max:200})}${field('contact.summary','Short introduction',c.summary,{area:true,wide:true,optional:true,max:1200,placeholder:'What have you practiced, and what kind of contribution are you ready to make?',hint:'One or two specific sentences. Avoid unsupported labels such as “results-driven visionary.”'})}</div>${next('discover','education')}`}
 function educationView(){return head('03','Build on what you are learning.','Your education gives your experience context. Include your most recent program first.')+state.education.map((e,i)=>`<div class="card"><div class="card-title"><div><p class="eyebrow">Education ${i+1}</p><h2>${esc(e.school)||'Your school or program'}</h2></div><button class="icon-btn" data-action="remove-education" data-id="${e.id}" aria-label="Remove education ${i+1}">${icon('trash')}</button></div><div class="field-grid">${field(`education.${e.id}.school`,'School or institution',e.school,{wide:true,placeholder:'University or college name'})}${field(`education.${e.id}.degree`,'Degree and major',e.degree,{wide:true,placeholder:'Bachelor of Business Administration in Marketing'})}${field(`education.${e.id}.dates`,'Graduation date',e.dates,{placeholder:'Expected May 2027',hint:'Include “Expected” if you are still studying.'})}${field(`education.${e.id}.location`,'Location',e.location,{optional:true,placeholder:'City, State'})}${field(`education.${e.id}.gpa`,'GPA',e.gpa,{optional:true,placeholder:'3.7 / 4.0',hint:'Include the scale. You can leave this out.'})}${field(`education.${e.id}.honors`,'Honors or distinction',e.honors,{optional:true,placeholder:'Dean’s List, Fall 2025'})}${field(`education.${e.id}.courses`,'Relevant coursework',e.courses,{optional:true,wide:true,placeholder:'Consumer Behavior, Business Analytics, Marketing Research',hint:'Choose a few courses that help explain your preparation.'})}</div></div>`).join('')+(!state.education.length?`<div class="empty-state">${icon('book')}<h2>Your education belongs here.</h2><p>Add a degree, certificate program, or other relevant study.</p></div>`:'')+`<button class="add-btn" data-action="add-education">${icon('plus')} Add education</button>${next('details','experience')}`}
 function feedbackHTML(e){return C.feedback(e).map(f=>`<div class="quality-item ${f.good?'good':''}">${icon(f.good?'check':'bulb')}<span>${esc(f.text)}</span></div>`).join('')}
 function experienceView(){return head('04','Turn experience into evidence.','Show your contribution, how you did it, and what came from it. Class projects and everyday responsibilities count.')+(!state.experiences.length?`<div class="empty-state">${icon('briefcase')}<h2>Start with one real experience.</h2><p>Think of something you made clearer, easier, more useful, or more reliable.</p><button class="btn primary" data-action="choose-source">${icon('plus')} Find an experience</button></div>`:state.experiences.map((e,i)=>{const source=C.SOURCES[e.source],open=e.id===openExperience;return `<div class="card" id="entry-${e.id}"><button class="entry-header" data-action="toggle-entry" data-id="${e.id}" aria-expanded="${open}" aria-controls="body-${e.id}"><span class="flex"><span class="entry-number">${String(i+1).padStart(2,'0')}</span><span><span class="entry-title">${esc(e.role)||source.label}</span><span class="entry-meta">${esc(e.organization)||'Give this experience a name'}${e.include?'':' · Hidden from résumé'}</span></span></span>${icon(open?'up':'down')}</button>${!open?`<p class="entry-summary">${esc(C.lines(e.bullets)[0]||'A real moment, waiting for your words.')}</p>`:''}<div class="entry-body" id="body-${e.id}" ${open?'':'hidden'}><div class="field-grid">${field(`experiences.${e.id}.role`,'Your role',e.role,{placeholder:source.role})}${field(`experiences.${e.id}.organization`,'Organization or project',e.organization,{placeholder:source.org})}${field(`experiences.${e.id}.dates`,'Dates',e.dates,{placeholder:'January 2026 to Present'})}${field(`experiences.${e.id}.location`,'Location',e.location,{optional:true,placeholder:'City, State or Remote'})}${field(`experiences.${e.id}.section`,'Résumé section',e.section,{wide:true,select:[['experience','Experience'],['projects','Projects'],['leadership','Leadership & Service']]})}</div><div class="prompt-block"><h3>Find the story behind the bullet.</h3><p>${source.prompt} These answers help you draft; only your finished bullets appear on the résumé.</p>${field(`experiences.${e.id}.action`,'1. What did you personally do?',e.action,{area:true,rows:2,placeholder:source.action,hint:'Start with an action. Be clear about your own role in a team effort.'})}${field(`experiences.${e.id}.method`,'2. How did you do it?',e.method,{area:true,rows:2,placeholder:source.method,hint:'Name a tool, approach, process, or constraint you worked with.'})}${field(`experiences.${e.id}.result`,'3. What changed or what did you deliver?',e.result,{area:true,rows:2,placeholder:source.result,hint:'A usable deliverable, clearer decision, or reliable process counts. Never invent a number.'})}<button class="btn mt16" data-action="draft-bullet" data-id="${e.id}">${icon('file')} Build a bullet from my answers</button><details class="mt16"><summary>No numbers? You still have evidence.</summary><p>Think about scope (how many items or people), use (who relied on it), quality (what became clearer), or delivery (what you finished). Include only what you know. A team outcome should remain a team outcome.</p></details></div><div class="draft-result">${field(`experiences.${e.id}.bullets`,'Your résumé bullets',e.bullets,{area:true,rows:5,max:5000,placeholder:'Write or build a bullet, then edit it to sound like you. Put each bullet on a new line.',hint:'Only this text, your role, organization, location, and dates appear in the résumé.'})}<div class="bullet-count" id="count-${e.id}">${C.lines(e.bullets).length} bullet${C.lines(e.bullets).length===1?'':'s'}</div><div class="quality-notes" id="feedback-${e.id}">${feedbackHTML(e)}</div></div><details class="mt16" ${e.evidence||e.reflection?'open':''}><summary>Keep the evidence behind your words</summary><p>Private notes for your own reflection and future interviews. Excluded from Word and print exports; included in your backup file.</p>${field(`experiences.${e.id}.evidence`,'How do you know?',e.evidence,{area:true,rows:2,placeholder:'A spreadsheet, project file, feedback, person who saw the work, or a careful explanation of your estimate.'})}${field(`experiences.${e.id}.reflection`,'What did you notice, decide, or learn?',e.reflection,{area:true,rows:2,placeholder:'What was your judgment call? What would have been different without your contribution?'})}</details><label class="check-label mt16"><input type="checkbox" data-field="experiences.${e.id}.verified" ${e.verified?'checked':''}>I can explain my contribution and support every claim above.</label><div class="entry-controls"><label class="check-label"><input type="checkbox" data-field="experiences.${e.id}.include" ${e.include?'checked':''}>Include in résumé</label><button class="icon-btn" data-action="move-entry" data-id="${e.id}" data-dir="-1" aria-label="Move experience up" ${i===0?'disabled':''}>${icon('up')}</button><button class="icon-btn" data-action="move-entry" data-id="${e.id}" data-dir="1" aria-label="Move experience down" ${i===state.experiences.length-1?'disabled':''}>${icon('down')}</button><button class="btn subtle danger compact" data-action="remove-experience" data-id="${e.id}">Remove</button></div></div></div>`}).join(''))+`<button class="add-btn mt16" data-action="choose-source">${icon('plus')} Add another experience</button><p class="small muted mt16">Arrange entries within each section from most recent to oldest. Use “Finish &amp; export” to change section order.</p>${next('education','skills')}`}
 function skillsView(){return head('05','Be specific about your strengths.','Use skills you can demonstrate. Your experience should help explain where you practiced them.')+`<div class="stack">${field('skills.tools','Tools and technology',state.skills.tools,{area:true,placeholder:'Excel (pivot tables), Canva, Google Analytics, Python',hint:'Add context when it helps. Avoid rating bars or vague proficiency percentages.'})}${field('skills.methods','Methods and practical skills',state.skills.methods,{area:true,placeholder:'Survey design, financial modeling, content planning, lab techniques',hint:'Think about what you have actually practiced in a course, job, or project.'})}${field('skills.languages','Languages',state.skills.languages,{area:true,rows:2,placeholder:'English (fluent), Spanish (conversational)',hint:'Describe your current level accurately. Leave blank if you prefer.'})}</div><div class="subheading"><h2>What else helps someone understand you?</h2><p>Relevant certifications, awards, or a specific interest can add context. Keep the details meaningful.</p></div>${field('extras','Additional highlights',state.extras,{area:true,rows:5,optional:true,max:5000,placeholder:'Certification name, issuer, year\nAward name, organization, year\nSpecific interest with relevant context',hint:'Put each item on a new line. Skip “References available upon request.”'})}<div class="insight">${icon('bulb')}<div><strong>Let your experience show your soft skills.</strong><p>Instead of listing “leadership,” describe the event you organized. Instead of “communication,” show what you explained and who used it.</p></div></div>${next('experience','finish','Review my résumé')}`}
 function finishView(){const a=C.assessments(state),n=a.filter(x=>x.ready).length,words=C.countWords(state),unverified=C.active(state).filter(e=>!e.verified).length;return head('06','Make it unmistakably yours.','Read it as someone meeting you for the first time. Then take an editable copy with you.')+`<p class="finish-intro"><strong>${n} of 5 foundations ready.</strong> This checklist helps you review the basics. It is not a hiring prediction or an ATS score.</p>${a.map(c=>`<div class="check-card ${c.ready?'ready':''}"><span class="check-icon">${icon(c.ready?'check':'info')}</span><div><h3>${c.name}</h3><p>${c.ready?({details:'Your name and email are in place.',education:'Your school and program are included.',experience:c.name.startsWith('Back')?'You have reviewed the claims in your included experiences.':'You have added at least one résumé bullet.',skills:'You have named skills to discuss or demonstrate.'}[c.step]):c.description}</p></div><button class="btn subtle compact" data-action="step" data-step="${c.step}">${c.ready?'Edit':'Review'}</button></div>`).join('')}<div class="subheading"><h2>Keep the presentation simple.</h2><p>A clear single column, standard headings, and selectable text keep your content easy to read.</p></div><div class="word-options">${field('style','Type style',state.style,{select:[['modern','Modern · Arial'],['classic','Classic · Georgia']]})}${field('density','Spacing',state.density,{select:[['comfortable','Comfortable'],['compact','Compact']]})}</div><details class="mt16"><summary>Arrange your sections</summary><p>Education first is a useful starting point for students. Move your strongest evidence higher. Empty sections are left out automatically.</p><ol class="section-order">${state.order.map((k,i)=>`<li><span>${C.LABELS[k]}</span><button class="icon-btn" data-action="move-section" data-key="${k}" data-dir="-1" aria-label="Move ${C.LABELS[k]} up" ${i===0?'disabled':''}>${icon('up')}</button><button class="icon-btn" data-action="move-section" data-key="${k}" data-dir="1" aria-label="Move ${C.LABELS[k]} down" ${i===state.order.length-1?'disabled':''}>${icon('down')}</button></li>`).join('')}</ol></details><div class="export-card"><div class="flex between"><h2>Your résumé. Yours to edit.</h2><span class="tag">${words} words</span></div><p>A real .docx file with editable text and bullets. Your private reflection notes are excluded.</p>${unverified?`<p><strong>${unverified} included experience${unverified===1?' has':'s have'} claims still to review.</strong> You can export a draft now and come back.</p>`:''}<button class="btn primary" data-action="export">${icon('download')} Download Word résumé</button><div class="flex wrap mt16"><button class="btn subtle compact" data-action="preview">${icon('expand')} Full preview</button><button class="btn subtle compact" data-action="print">Print / Save PDF</button></div><p class="small" style="margin-bottom:0">Aim for a focused first résumé, often one page. Page breaks can differ in Word; check them before sending. ${words>600?'This draft is getting long. Consider keeping only the most useful evidence.':''}</p></div><div class="flex wrap mt16"><button class="btn link" data-action="backup">Save editable project backup</button><span class="muted" aria-hidden="true">·</span><button class="btn link" data-action="template">Download blank Word template</button></div>${next('skills','discover','Find another experience')}`}
 function resumeHTML(s,ghosts=false){const c=C.content(s);let html=`<div class="resume-name ${!c.name?'ghost':''}">${esc(c.name||'Your name')}</div><div class="resume-contact ${!c.contact.length?'ghost':''}">${esc(c.contact.join(' · ')||(ghosts?'City, State · Email · Phone · Portfolio':''))}</div>`;if(c.headline)html+=`<div class="resume-headline">${esc(c.headline)}</div>`;if(c.summary)html+=`<p>${esc(c.summary)}</p>`;const sections=ghosts?s.order.map(k=>c.sections.find(x=>x.key===k)||(['education','experience','projects','skills'].includes(k)?{key:k,title:C.LABELS[k],entries:[],ghost:true}:null)).filter(Boolean):c.sections;for(const section of sections){html+=`<section class="resume-section ${section.ghost?'ghost':''}"><h3>${esc(section.title)}</h3>`;if(section.ghost)html+=`<div class="resume-entry"><strong>${{education:'Your school · Degree and major',experience:'Your role · Organization',projects:'Your contribution · Project name',skills:'Tools, methods, and languages'}[section.key]}</strong>${section.key==='skills'?'':'<div class="ghost-lines"><i></i><i></i><i></i></div>'}</div>`;else for(const e of section.entries)html+=`<div class="resume-entry">${e.title?`<strong>${esc(e.title)}</strong>`:''}${e.sub?`<div class="resume-sub">${esc(e.sub)}</div>`:''}${e.bullets.length?`<ul>${e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}</div>`;html+='</section>'}return html}
 function preview(){const el=$('#resume-preview');el.className=`paper ${state.style} ${state.density}`;el.innerHTML=resumeHTML(state,true);$('#preview-caption').textContent='Layout guide · Gray placeholders are not exported.';$('#preview-tip').innerHTML=icon('bulb')+`<span>${tipTexts[step]}</span>`}
 function render(focus=false){nav();$('#editor').innerHTML=({discover,details,education:educationView,experience:experienceView,skills:skillsView,finish:finishView}[step])();preview();if(focus){$('#editor h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});$('.nav-step.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}}
 function go(k){if(!steps.some(([key])=>key===k))return;step=k;notice='';if(k==='education'&&!state.education.length){state.education.push(C.education());save()}if(k==='experience'&&!openExperience&&state.experiences.length)openExperience=state.experiences[0].id;render(true)}
 function update(el){const path=el.dataset.field?.split('.');if(!path)return;const value=el.type==='checkbox'?el.checked:el.value;if(path.length===1&&['extras','style','density'].includes(path[0]))state[path[0]]=value;else if(['contact','skills'].includes(path[0])&&Object.hasOwn(state[path[0]],path[1]))state[path[0]][path[1]]=value;else if(['education','experiences'].includes(path[0])){const entry=state[path[0]].find(e=>e.id===path[1]);if(entry&&Object.hasOwn(entry,path[2])){entry[path[2]]=value;if(path[0]==='experiences'&&['bullets','role','organization'].includes(path[2])){entry.verified=false;const check=document.querySelector(`[data-field="experiences.${entry.id}.verified"]`);if(check)check.checked=false}if(path[0]==='experiences'){const notes=$('#feedback-'+entry.id);if(notes)notes.innerHTML=feedbackHTML(entry);const count=$('#count-'+entry.id);if(count)count.textContent=C.lines(entry.bullets).length+' bullet'+(C.lines(entry.bullets).length===1?'':'s')}}}save();preview();nav()}
 function modal(title,body,opts={}){const m=$('#modal');m.className=opts.preview?'dialog-preview':'';m.innerHTML=`<div class="dialog-head"><div><h2 id="modal-title">${title}</h2>${opts.subtitle?`<p>${opts.subtitle}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}`;if(!m.open)m.showModal()}
 function confirmAction(title,message,action,label='Remove',extra=''){modal(title,`<p class="dialog-copy">${message}</p><div class="dialog-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn ${action==='confirm-reset'?'danger':'primary'}" data-action="${action}" ${extra}>${label}</button></div>`)}
 function addSource(source){if(!Object.hasOwn(C.SOURCES,source))return;const e=C.experience(source);state.experiences.push(e);openExperience=e.id;$('#modal').close();step='experience';save();render(true);setTimeout(()=>document.querySelector(`[data-field="experiences.${e.id}.role"]`)?.focus(),30)}
 function chooseSource(){modal('Where did this experience happen?',`<div class="source-select">${Object.entries(C.SOURCES).map(([k,s])=>`<button class="btn" data-action="add-source" data-source="${k}">${icon(s.icon)} ${s.label}</button>`).join('')}</div>`,{subtitle:'Choose a starting point. You can change its résumé section later.'})}
 const examples={marketing:{label:'Marketing',before:'Helped with a social media project.',after:'Created a four-week content calendar and six Canva mockups for a student campaign proposal, using audience research to select the content themes.',why:'Names a contribution, a method, and a deliverable without claiming that an unlaunched campaign increased sales.'},business:{label:'Business',before:'Responsible for inventory.',after:'Organized weekly stock checks across four product categories and flagged discrepancies for the shift lead.',why:'Makes everyday work concrete. Scope and a useful handoff can show value without a percentage.'},engineering:{label:'Engineering',before:'Worked on a team design project.',after:'Modeled a prototype housing in CAD and documented three design revisions based on team fit tests.',why:'Clarifies the student’s own work and the evidence that informed it.'},humanities:{label:'Other majors',before:'Good research and communication skills.',after:'Compared eight primary sources for a local history project and created an annotated exhibit guide for a campus presentation.',why:'Shows research and communication through an observable piece of work.'}};
 function showExample(){const x=examples[exampleTab];modal('From a responsibility to a contribution.',`<div class="example-tabs" role="group" aria-label="Example subject">${Object.entries(examples).map(([k,v])=>`<button class="chip ${k===exampleTab?'active':''}" data-action="example-tab" data-tab="${k}" aria-pressed="${k===exampleTab}">${v.label}</button>`).join('')}</div><p class="eyebrow" style="color:var(--muted)">The starting thought</p><p class="mt16" style="margin-top:7px">${x.before}</p><div class="coach-example"><p class="eyebrow">With specific evidence</p><p>${x.after}</p></div><p class="dialog-copy mt16">${x.why}</p><p class="small muted mt16">These examples are fictional. Borrow the structure; use your own facts.</p><div class="dialog-actions"><button class="btn" data-action="sample-preview">See a full sample résumé</button><button class="btn primary" data-action="close-modal">Back to mine</button></div>`)}
 function showPreview(sample=false){const s=sample?C.sample():state;modal(sample?'A fictional student résumé':'Your résumé preview',`<div class="paper-wrap"><article class="paper ${s.style} ${s.density}">${resumeHTML(s,false)}</article></div><p class="small muted mt16">${sample?'Jordan Rivera and all experiences shown here are fictional. Your own draft is unchanged.':'Private notes and empty sections are excluded. This preview approximates the document; Word controls the final page breaks.'}</p><div class="dialog-actions"><button class="btn" data-action="close-modal">Close preview</button>${sample?'':`<button class="btn primary" data-action="export">${icon('download')} Download Word</button>`}</div>`,{preview:true})}
 function dataModal(){modal('Your work stays with you.',`<p class="dialog-copy">Proof does not send your résumé anywhere. Browser storage belongs to this browser and device; it is not a cloud backup.</p><div class="data-row"><div><strong>Remember on this device</strong><p>Turn off on a shared computer. Clearing browser data also removes saved drafts.</p></div><label class="switch-label"><input id="remember-toggle" type="checkbox" ${remember?'checked':''}><span>Save locally</span></label></div><div class="data-row"><div><strong>Save a project backup</strong><p>Includes your résumé and private evidence notes. Keep it somewhere you trust. Import it to continue on another device.</p></div><button class="btn" data-action="backup">${icon('download')} Save backup</button></div><div class="data-row"><div><strong>Open a Proof backup</strong><p>Replaces the current draft after confirmation. Word files cannot be imported.</p></div><button class="btn" data-action="import">Open .json</button></div><div class="data-row"><div><strong>Download the offline app</strong><p>One HTML file. Open it in a modern browser with no connection. Your personal data is not bundled into the app.</p></div><button class="btn" data-action="offline">Save app</button></div><div class="data-row"><div><strong>Start fresh</strong><p>Removes the draft from this browser. Download a backup first if you want to keep it.</p></div><button class="btn danger" data-action="reset">Clear draft</button></div>`)}
 function about(){modal('A résumé built from your own evidence.',`<div class="dialog-copy"><p>Proof helps students notice their contributions, describe them clearly, and keep track of the evidence behind them. It was designed for marketing and business students, with prompts that work across majors.</p><p><strong>How the coaching works:</strong> built-in prompts, editable sentence assembly, and simple writing checks. It does not use AI, predict hiring outcomes, or invent accomplishments.</p><p><strong>Privacy:</strong> the standalone app makes no network requests. It uses no analytics, accounts, external fonts, or AI services. A hosting provider still receives the initial page request if you use a hosted version.</p><p><strong>Open source:</strong> MIT licensed. The entire app, including Word export, is contained in one HTML file. Download it, inspect it, adapt it, or share it with your class.</p><p><strong>Scope:</strong> a general résumé for students and early-career applicants, with US Letter output. Local conventions and academic CV requirements may differ.</p></div><div class="flex wrap mt16"><button class="btn" data-action="offline">${icon('download')} Download app & source</button><button class="btn" data-action="data">Manage my data</button></div>`)}
 function download(data,name,type){const blob=data instanceof Blob?data:new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
 function exportWord(template=false){const s=template?C.template():state;download(C.docx(s),template?'Proof-Resume-Template.docx':(s.contact.name.trim().replace(/[^\p{L}\p{N} _-]/gu,'').replace(/\s+/g,'-')||'My')+'-Resume.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast(template?'Blank Word template prepared. Check your downloads.':'Word résumé prepared. Check your downloads, then review its page breaks.')}
 function backup(){download(JSON.stringify(state,null,2),'Proof-Resume-Backup.json','application/json');toast('Backup downloaded, including your private evidence notes.')}
 function offline(){const style=document.querySelector('style').textContent,core=$('#proof-core').textContent,ui=$('#proof-ui').textContent,body=document.body.cloneNode(true);body.querySelectorAll('script').forEach(e=>e.remove());body.querySelector('#editor').replaceChildren();body.querySelector('#steps').replaceChildren();body.querySelector('#resume-preview').replaceChildren();body.querySelector('#preview-tip').replaceChildren();body.querySelector('#modal').replaceChildren();body.querySelector('#modal').removeAttribute('open');body.querySelector('#toast').textContent='';body.querySelector('#toast').hidden=true;body.querySelector('#print-root').replaceChildren();body.querySelector('#save-state').replaceChildren();body.querySelector('#progress-text').textContent='';body.querySelector('#progress-fill').style.width='0';body.querySelector('#progress').setAttribute('aria-valuenow','0');body.querySelectorAll('[inert]').forEach(e=>e.removeAttribute('inert'));const head=document.head.cloneNode(true);head.querySelectorAll('script,style,link[rel="modulepreload"]').forEach(e=>e.remove());const html='<!doctype html>\n<html lang="en">\n<head>'+head.innerHTML+'<style>'+style+'</style></head><body>'+body.innerHTML+'<script id="proof-core">'+core+'<\/script><script id="proof-ui">'+ui+'<\/script></body></html>';download(html,'Proof-Resume.html','text/html');toast('Offline app downloaded. Save a backup separately to take your draft with you.')}
 let pendingImport=null;
 document.addEventListener('input',e=>{if(e.target.matches('[data-field]')&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')update(e.target)});
 document.addEventListener('change',e=>{if(e.target.matches('[data-field]')&&(e.target.type==='checkbox'||e.target.tagName==='SELECT'))update(e.target);if(e.target.id==='remember-toggle'){remember=e.target.checked;state.remember=remember;try{sessionStorage.setItem('proof-save-mode',remember?'local':'session')}catch{}if(!remember){clearTimeout(saveTimer);try{localStorage.removeItem(KEY)}catch(err){toast('Could not clear browser storage. Use browser settings to remove it.')}$('#save-state').innerHTML=icon('lock')+'<span>Session only</span>'}else save();toast(remember?'Saving on this device is enabled.':'Local saving is off. Download a backup before closing.')}});
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
  if(a==='step')go(b.dataset.step);else if(a==='dismiss-notice'){notice='';render()}else if(a==='add-source')addSource(b.dataset.source);else if(a==='choose-source')chooseSource();else if(a==='close-modal')$('#modal').close();else if(a==='add-education'){state.education.push(C.education());save();render();const last=state.education.at(-1);document.querySelector(`[data-field="education.${last.id}.school"]`)?.focus()}
  else if(a==='toggle-entry'){openExperience=openExperience===b.dataset.id?null:b.dataset.id;render()}
  else if(a==='draft-bullet'){const entry=findEntry(b.dataset.id),text=C.draft(entry);if(!text){toast('Describe what you personally did first.');document.querySelector(`[data-field="experiences.${entry.id}.action"]`)?.focus();return}if(C.lines(entry.bullets).includes(text)){toast('This bullet is already in your résumé. Edit it below.');return}entry.bullets=(entry.bullets.trim()?entry.bullets.trim()+'\n':'')+text;entry.verified=false;save();render();document.querySelector(`[data-field="experiences.${entry.id}.bullets"]`)?.focus();toast('Your answers are now a draft bullet. Edit the wording so it sounds natural.')}
  else if(a==='move-entry'){const i=state.experiences.findIndex(x=>x.id===b.dataset.id),j=i+Number(b.dataset.dir);if(j>=0&&j<state.experiences.length){[state.experiences[i],state.experiences[j]]=[state.experiences[j],state.experiences[i]];save();render()}}
  else if(a==='remove-experience'||a==='remove-education')confirmAction('Remove this entry?','This removes the entry and its notes from your draft.','confirm-'+a,'Remove',`data-id="${b.dataset.id}"`);
  else if(a==='confirm-remove-experience'){state.experiences=state.experiences.filter(x=>x.id!==b.dataset.id);openExperience=state.experiences[0]?.id||null;$('#modal').close();save();render()}
  else if(a==='confirm-remove-education'){state.education=state.education.filter(x=>x.id!==b.dataset.id);$('#modal').close();save();render()}
  else if(a==='move-section'){const i=state.order.indexOf(b.dataset.key),j=i+Number(b.dataset.dir);if(j>=0&&j<state.order.length){[state.order[i],state.order[j]]=[state.order[j],state.order[i]];save();render();$('#editor details').open=true}}
  else if(a==='example')showExample();else if(a==='example-tab'){exampleTab=b.dataset.tab;showExample()}else if(a==='sample-preview')showPreview(true);else if(a==='preview')showPreview();else if(a==='data')dataModal();else if(a==='about')about();else if(a==='export')exportWord();else if(a==='template')exportWord(true);else if(a==='backup')backup();else if(a==='offline')offline();else if(a==='import'){$('#import-file').value='';$('#import-file').click()}
  else if(a==='confirm-import'){state=pendingImport;pendingImport=null;remember=state.remember;try{sessionStorage.setItem('proof-save-mode',remember?'local':'session')}catch{}openExperience=null;if(!remember){try{localStorage.removeItem(KEY)}catch{}}$('#modal').close();step='finish';save();render();toast('Your backup is open. Review it before exporting.')}
  else if(a==='reset')confirmAction('Clear your résumé?','This removes the current draft and its saved copy from this browser. Downloaded files will remain. Save a backup first if needed.','confirm-reset','Clear draft');
  else if(a==='confirm-reset'){clearTimeout(saveTimer);try{localStorage.removeItem(KEY)}catch{}state=C.blank();state.remember=remember;openExperience=null;notice='';step='discover';$('#modal').close();save();render(true);toast('Your draft has been cleared.')}
  else if(a==='print'){$('#modal').close();$('#print-root').innerHTML=`<article class="paper ${state.style} ${state.density}">${resumeHTML(state,false)}</article>`;window.print()}
 });
 $('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1000000){toast('Choose a Proof backup smaller than 1 MB.');return}try{pendingImport=C.normalize(JSON.parse(await file.text()));confirmAction('Open this backup?',`This replaces your current draft with ${esc(pendingImport.contact.name||'the imported résumé')}. Download a backup of your current work first if you need it.`,'confirm-import','Open backup')}catch(err){pendingImport=null;toast(err.message||'This backup could not be opened. Your draft is unchanged.')}});
 window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
 $('#expand-btn').innerHTML=icon('expand');$('#privacy-label').innerHTML=icon('lock')+'Your story stays yours.';$('#save-state').innerHTML=icon('lock')+`<span>${remember?'Saved on this device':'Session only'}</span>`;render();
 // Local navigation only. No résumé-reading agent tool is exposed.
 if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'navigate_resume_section',title:'Open a résumé workshop section',description:'Navigate to a visible section of the local résumé workshop. Does not read résumé content or export files.',inputSchema:{type:'object',properties:{section:{type:'string',enum:steps.map(([k])=>k)}},required:['section'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length!==1||!steps.some(([k])=>k===input.section))throw new Error('Choose a valid résumé section.');go(input.section);return {section:step}}},{signal:lifecycle.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
})();
</script>
</body>
